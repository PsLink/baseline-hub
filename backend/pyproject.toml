[project]
name = "baseline-hub"
version = "0.1.0"
description = "Baseline Hub API, AutoTune proxy and Catalog publisher"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2", "pydantic-settings>=2.3", "httpx[socks]>=0.28",
  "pyyaml>=6", "bcrypt>=4.1", "cryptography>=42", "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest-asyncio>=0.23", "pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseline_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
